<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camera Lucida App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button
      id="menuToggle"
      type="button"
      aria-controls="controlsPanel"
      aria-expanded="false"
    >
      Controls
    </button>

    <div class="controls" id="controlsPanel">
      <div class="controls-header">
        <strong>Controls</strong>
        <button id="closeControlsButton" type="button">Close</button>
      </div>
      <div class="control-group">
        <input type="file" accept="image/*" id="imageInput" hidden />
        <button id="chooseOverlayButton" type="button">Choose Overlay</button>
      </div>
      <div class="control-group">
        <label>
          <span>Opacity:</span>
          <input
            type="range"
            id="opacitySlider"
            min="0"
            max="1"
            step="0.01"
            value="0.5"
          />
        </label>
      </div>
      <div class="control-group">
        <label for="overlayModeSelect">Overlay Mode:</label>
        <select id="overlayModeSelect">
          <option value="normal">Normal</option>
          <option value="inverseMask">Inverse Alpha Mask</option>
          <option value="edges">Edges</option>
        </select>
      </div>
      <div class="control-group" id="edgeThresholdGroup" hidden>
        <label>
          <span>Edge Threshold:</span>
          <input
            type="range"
            id="edgeThresholdSlider"
            min="0.02"
            max="1.5"
            step="0.01"
            value="0.3"
          />
        </label>
      </div>
      <div class="control-group">
        <label>
          <input type="checkbox" id="pencilToggle" />
          <span>Enhance Pencil</span>
        </label>
      </div>
      <div class="control-group" id="pencilStrengthGroup" hidden>
        <label>
          <span>Pencil Strength:</span>
          <input
            type="range"
            id="pencilStrengthSlider"
            min="1"
            max="20"
            step="0.5"
            value="6"
          />
        </label>
      </div>
      <div class="camera-row">
        <div class="control-group camera-group">
          <label for="cameraSelect">Camera:</label>
          <select id="cameraSelect" disabled>
            <option>Start camera to choose</option>
          </select>
        </div>
        <button id="startCameraButton">Start Camera</button>
      </div>
      <span id="cameraStatus" role="status" aria-live="polite"></span>
    </div>

    <!-- Video and canvas container -->
    <div id="canvasContainer">
      <canvas id="webglCanvas"></canvas>
      <div id="frozenIndicator" hidden>Frozen</div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
